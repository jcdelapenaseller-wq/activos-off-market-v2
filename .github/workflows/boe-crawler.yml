name: BOE Daily Crawler

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run crawler
        run: node scripts/boeCrawler.js

      - name: Commit updated auctions
        run: |
          git config --global user.name "boe-bot"
          git config --global user.email "bot@github.com"
          git add src/data/auctions.ts
          git commit -m "auto: update auctions" || echo "No changes"
          git push
