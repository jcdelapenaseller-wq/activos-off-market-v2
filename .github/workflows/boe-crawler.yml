name: BOE Daily Crawler

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run BOE crawler
        run: node scripts/boeCrawler.cjs

      - name: Run Telegram notifier
        run: node scripts/telegramNotifier.cjs
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Commit updated auctions if needed
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add src/data/auctions.ts
          git diff --staged --quiet || git commit -m "Auto update auctions"
          git push
